name: CI

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  validate:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

  versioning:
    name: Versioning
    needs: validate
    if: ${{ github.event_name == 'push' && success() }}
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    uses: SuikaStudio/ci-workflows/.github/workflows/versioning.yml@main
    with:
      branch: dev
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [validate, versioning]
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          name: ${{ needs.versioning.outputs.new_tag }}
          body_path: ${{ runner.temp }}/changelog/changelog.txt
          prerelease: true
